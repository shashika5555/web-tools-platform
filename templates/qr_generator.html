{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg">
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">📱 QR Code Generator</h2>
        <p class="text-slate-400 text-sm">Convert any link, text, or phone number into a QR Code.</p>
    </div>

    <form action="/qr-generator" method="POST" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Enter URL or Text</label>
            <textarea name="text" rows="3" required placeholder="https://example.com or any text..." class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:outline-none focus:border-green-500"></textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-green-500/20">
            Generate & Download QR Code
        </button>
    </form>
</div>
{% endblock %}
