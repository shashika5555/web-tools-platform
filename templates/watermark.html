{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg">
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">🖼️ Image Watermark Adder</h2>
        <p class="text-slate-400 text-sm">Add custom text watermark to your images.</p>
    </div>

    <form action="/watermark" method="POST" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Select Image</label>
            <input type="file" name="image" accept="image/*" required class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-pink-600 file:text-white hover:file:bg-pink-500 cursor-pointer bg-slate-900/50 border border-slate-700 rounded-xl p-2">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Watermark Text</label>
            <input type="text" name="watermark_text" value="© MyBrand" required class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:outline-none focus:border-pink-500">
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-pink-500/20">
            Apply Watermark 🖼️
        </button>
    </form>
</div>
{% endblock %}
