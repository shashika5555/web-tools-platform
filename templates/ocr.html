{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg">
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">🔍 Image & PDF to Text (OCR)</h2>
        <p class="text-slate-400 text-sm">Upload any image or PDF to extract readable text instantly.</p>
    </div>

    <form action="/ocr" method="POST" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Select Image or PDF File</label>
            <input type="file" name="file" accept="image/*,.pdf" required class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 cursor-pointer bg-slate-900/50 border border-slate-700 rounded-xl p-2">
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-cyan-500/20">
            Extract Text 📄
        </button>
    </form>

    {% if extracted_text %}
    <div class="mt-8 border-t border-slate-700 pt-6">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-lg font-semibold text-white">Extracted Text:</h3>
            <button onclick="navigator.clipboard.writeText(document.getElementById('extractedText').value)" class="px-4 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg transition-colors">
                📋 Copy Text
            </button>
        </div>
        <textarea id="extractedText" rows="10" class="w-full bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-xl p-4 focus:outline-none focus:border-cyan-500 font-mono" readonly>{{ extracted_text }}</textarea>
    </div>
    {% endif %}
</div>
{% endblock %}
