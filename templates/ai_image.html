{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg">
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">✨ Free AI Image Generator</h2>
        <p class="text-slate-400 text-sm">Create stunning images from text prompts instantly.</p>
    </div>

    <form action="/ai-image" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Prompt</label>
            <textarea name="prompt" rows="3" required placeholder="A futuristic cyberpunk city in Sri Lanka, 8k resolution, photorealistic..." class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:outline-none focus:border-blue-500">{{ prompt }}</textarea>
        </div>
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-purple-500/20">
            Generate Image 🚀
        </button>
    </form>

    {% if image_url %}
    <div class="mt-8 text-center border-t border-slate-700 pt-6">
        <h3 class="text-lg font-semibold text-white mb-4">Generated Result:</h3>
        <img src="{{ image_url }}" alt="AI Result" class="rounded-xl w-full max-h-[500px] object-cover mb-4 border border-slate-700 shadow-2xl">
        <a href="{{ image_url }}" target="_blank" download="ai_image.png" class="inline-block px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium text-sm transition-colors">
            Download High Resolution Image
        </a>
    </div>
    {% endif %}
</div>
{% endblock %}
