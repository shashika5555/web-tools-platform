{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg">
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">🔗 URL Shortener</h2>
        <p class="text-slate-400 text-sm">Shorten long links for easy sharing.</p>
    </div>

    <form action="/url-shortener" method="POST" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Paste Long URL</label>
            <input type="text" name="url" placeholder="https://example.com/very-long-link-path..." required class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:outline-none focus:border-indigo-500">
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-indigo-500/20">
            Shorten Link 🔗
        </button>
    </form>

    {% if short_url %}
    <div class="mt-8 border-t border-slate-700 pt-6 text-center">
        <p class="text-slate-400 text-sm mb-2">Your Shortened Link:</p>
        <div class="flex items-center gap-2">
            <input type="text" id="shortUrl" value="{{ short_url }}" readonly class="w-full bg-slate-900 border border-slate-700 text-indigo-400 font-mono text-sm rounded-xl p-3 text-center focus:outline-none">
            <button onclick="navigator.clipboard.writeText(document.getElementById('shortUrl').value)" class="px-4 py-3 bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium rounded-xl transition-colors whitespace-nowrap">
                📋 Copy
            </button>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
