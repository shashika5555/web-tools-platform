{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg">
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">📄 Image to PDF Converter</h2>
        <p class="text-slate-400 text-sm">Combine multiple images into a single PDF document.</p>
    </div>

    <form action="/image-to-pdf" method="POST" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Select Images (Multiple allowed)</label>
            <input type="file" name="images" multiple required class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-500 cursor-pointer bg-slate-900/50 border border-slate-700 rounded-xl p-2">
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-red-500/20">
            Convert Images to PDF
        </button>
    </form>
</div>
{% endblock %}
