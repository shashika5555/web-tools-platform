{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg">
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">📑 PDF Merger</h2>
        <p class="text-slate-400 text-sm">Combine multiple PDF files into one single PDF document.</p>
    </div>

    <form action="/pdf-merger" method="POST" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Select PDF Files (Multiple allowed)</label>
            <input type="file" name="pdfs" accept=".pdf" multiple required class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-orange-600 file:text-white hover:file:bg-orange-500 cursor-pointer bg-slate-900/50 border border-slate-700 rounded-xl p-2">
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-orange-500/20">
            Merge PDFs 📑
        </button>
    </form>
</div>
{% endblock %}
