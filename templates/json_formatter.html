{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg">
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">📄 JSON Formatter & Validator</h2>
        <p class="text-slate-400 text-sm">Format, beautify, and validate your JSON data.</p>
    </div>

    <form action="/json-formatter" method="POST" class="space-y-6">
        <div>
            <textarea name="json_data" rows="8" placeholder='Paste raw JSON here (e.g. {"name": "Sashika", "status": "active"})' required class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 text-sm rounded-xl p-4 focus:outline-none focus:border-purple-500 font-mono">{{ raw_json }}</textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-purple-500/20">
            Format & Validate JSON 📄
        </button>
    </form>

    {% if error %}
    <div class="mt-6 p-4 bg-rose-900/30 border border-rose-500/50 text-rose-300 text-sm rounded-xl">
        {{ error }}
    </div>
    {% endif %}

    {% if formatted_json %}
    <div class="mt-8 border-t border-slate-700 pt-6">
        <div class="flex justify-between items-center mb-2">
            <span class="text-slate-300 text-sm font-medium">Formatted Output:</span>
            <button onclick="navigator.clipboard.writeText(document.getElementById('jsonOut').value)" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-white text-xs rounded-lg transition-colors">📋 Copy</button>
        </div>
        <textarea id="jsonOut" rows="10" readonly class="w-full bg-slate-950 border border-slate-800 text-purple-400 font-mono text-sm rounded-xl p-4 focus:outline-none">{{ formatted_json }}</textarea>
    </div>
    {% endif %}    
</div>
{% endblock %}
