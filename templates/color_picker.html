{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg text-center">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-white mb-1">🎨 Color Picker & HEX Code</h2>
        <p class="text-slate-400 text-sm">Pick colors and copy HEX or RGB codes instantly.</p>
    </div>

    <div class="space-y-6">
        <div class="flex justify-center">
            <input type="color" id="colorInput" value="#3b82f6" class="w-32 h-32 cursor-pointer bg-transparent border-0 rounded-xl">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
                <span class="block text-xs text-slate-400 mb-1">HEX Code</span>
                <span id="hexValue" class="text-xl font-bold text-blue-400 font-mono">#3B82F6</span>
            </div>
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
                <span class="block text-xs text-slate-400 mb-1">RGB Value</span>
                <span id="rgbValue" class="text-xl font-bold text-blue-400 font-mono">rgb(59, 130, 246)</span>
            </div>
        </div>
    </div>
</div>

<script>
    const colorInput = document.getElementById('colorInput');
    const hexValue = document.getElementById('hexValue');
    const rgbValue = document.getElementById('rgbValue');

    colorInput.addEventListener('input', (e) => {
        const hex = e.target.value.toUpperCase();
        hexValue.innerText = hex;
        
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        rgbValue.innerText = `rgb(${r}, ${g}, ${b})`;
    });
</script>
{% endblock %}
