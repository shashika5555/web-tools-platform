{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg">
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">📊 Unit Converter</h2>
        <p class="text-slate-400 text-sm">Convert Length, Data Storage, and Temperature units.</p>
    </div>

    <div class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Category</label>
            <select id="category" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:outline-none">
                <option value="data">Data Storage (Bytes, KB, MB, GB, TB)</option>
                <option value="length">Length (Meters, Feet, Inches, Km)</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">From Value</label>
                <input type="number" id="fromVal" value="1" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">From Unit</label>
                <select id="fromUnit" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:outline-none"></select>
            </div>
        </div>

        <div class="text-center text-slate-500 font-bold text-xl">↓</div>

        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 text-center">
            <span class="block text-xs text-slate-400 mb-1">Converted Value</span>
            <span id="resultVal" class="text-2xl font-bold text-cyan-400 font-mono">1024 KB</span>
        </div>

        <div>
            <label class="block text-xs text-slate-400 mb-1">To Unit</label>
            <select id="toUnit" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:outline-none"></select>
        </div>
    </div>
</div>

<script>
    const units = {
        data: { 'Bytes': 1, 'KB': 1024, 'MB': 1048576, 'GB': 1073741824, 'TB': 1099511627776 },
        length: { 'Meters': 1, 'Km': 1000, 'Feet': 0.3048, 'Inches': 0.0254 }
    };

    const catSelect = document.getElementById('category');
    const fromUnit = document.getElementById('fromUnit');
    const toUnit = document.getElementById('toUnit');
    const fromVal = document.getElementById('fromVal');
    const resultVal = document.getElementById('resultVal');

    function populateUnits() {
        const cat = catSelect.value;
        fromUnit.innerHTML = '';
        toUnit.innerHTML = '';
        Object.keys(units[cat]).forEach((u, i) => {
            fromUnit.add(new Option(u, u));
            toUnit.add(new Option(u, u));
        });
        toUnit.selectedIndex = 1;
        convert();
    }

    function convert() {
        const cat = catSelect.value;
        const val = parseFloat(fromVal.value) || 0;
        const base = val * units[cat][fromUnit.value];
        const res = base / units[cat][toUnit.value];
        resultVal.innerText = res.toLocaleString(undefined, {maximumFractionDigits: 4}) + ' ' + toUnit.value;
    }

    catSelect.addEventListener('change', populateUnits);
    fromUnit.addEventListener('change', convert);
    toUnit.addEventListener('change', convert);
    fromVal.addEventListener('input', convert);

    populateUnits();
</script>
{% endblock %}
