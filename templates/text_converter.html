{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg">
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">✍️ Text Case Converter & Counter</h2>
        <p class="text-slate-400 text-sm">Convert text format and get real-time word/character counts.</p>
    </div>

    <form action="/text-converter" method="POST" class="space-y-6">
        <div>
            <textarea name="text" rows="8" placeholder="Type or paste your text here..." required class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 text-sm rounded-xl p-4 focus:outline-none focus:border-emerald-500 font-mono">{{ text }}</textarea>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <button type="submit" name="action" value="uppercase" class="py-2.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded-xl transition-colors">UPPERCASE</button>
            <button type="submit" name="action" value="lowercase" class="py-2.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded-xl transition-colors">lowercase</button>
            <button type="submit" name="action" value="titlecase" class="py-2.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded-xl transition-colors">Title Case</button>
        </div>
    </form>

    {% if stats %}
    <div class="mt-8 border-t border-slate-700 pt-6 grid grid-cols-3 gap-4 text-center">
        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
            <span class="block text-2xl font-bold text-emerald-400">{{ stats.words }}</span>
            <span class="text-xs text-slate-400">Words</span>
        </div>
        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
            <span class="block text-2xl font-bold text-emerald-400">{{ stats.chars }}</span>
            <span class="text-xs text-slate-400">Characters</span>
        </div>
        <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
            <span class="block text-2xl font-bold text-emerald-400">{{ stats.lines }}</span>
            <span class="text-xs text-slate-400">Lines</span>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
