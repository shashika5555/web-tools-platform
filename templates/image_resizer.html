{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-slate-800/60 border border-slate-700 rounded-2xl p-8 backdrop-blur-lg">
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold text-white mb-1">Image Resizer</h2>
        <p class="text-slate-400 text-sm">Resize your images to custom dimensions.</p>
    </div>

    <form action="/image-resizer" method="POST" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Select Image File</label>
            <input type="file" name="image" required class="block w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer bg-slate-900/50 border border-slate-700 rounded-xl p-2">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Width (px)</label>
                <input type="number" name="width" value="800" class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Height (px)</label>
                <input type="number" name="height" value="600" class="w-full bg-slate-900/50 border border-slate-700 text-slate-200 text-sm rounded-xl p-3 focus:outline-none focus:border-indigo-500">
            </div>
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-indigo-500/20">
            Resize & Download
        </button>
    </form>
</div>
{% endblock %}
